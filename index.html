<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supermarket - Home</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <a class="logo" href="index.html">🛒 SuperMart</a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="login.html">Login</a>
    </div>
  </nav>

  <header class="hero">
    <h1>Welcome to SuperMart</h1>
    <p>Find your everyday supermarket products quickly.</p>

    <div class="search-box">
      <input id="searchInput" type="text" placeholder="Search products..." autocomplete="off">
      <button onclick="searchProducts()">🔍 Search</button>
    </div>
    <div id="suggestions"></div>
  </header>

  <section class="categories">
    <h2>Shop by Category</h2>
    <div class="category-grid">
      <div>🍎 Fruits</div>
      <div>🥦 Vegetables</div>
      <div>🥛 Dairy</div>
      <div>🍚 Grains</div>
      <div>🫘 Pulses</div>
      <div>🧼 Cleaning</div>
    </div>
  </section>

  <section class="products">
    <h2>Popular Products</h2>
    <div id="productList" class="product-grid"></div>
  </section>

  <footer>© 2026 SuperMart</footer>
  <script src="script.js"></script>
</body>
</html>
